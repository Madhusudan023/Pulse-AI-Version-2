<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Horizontal Ellipse -->
  <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="#3A82B8" stroke-width="3" />
  
  <!-- Diagonal Ellipse 1 -->
  <g transform="rotate(60 50 50)">
    <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="#3A82B8" stroke-width="3" />
    <!-- Electrons on this orbit -->
    <circle cx="8" cy="50" r="4.5" fill="#EFBE1C" />
    <circle cx="92" cy="50" r="4.5" fill="#EFBE1C" />
  </g>
  
  <!-- Diagonal Ellipse 2 -->
  <g transform="rotate(-60 50 50)">
    <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="#3A82B8" stroke-width="3" />
    <!-- Electrons on this orbit -->
    <circle cx="8" cy="50" r="4.5" fill="#EFBE1C" />
    <circle cx="92" cy="50" r="4.5" fill="#EFBE1C" />
  </g>

  <!-- Hexagon (Flat Top) -->
  <polygon points="38,30 62,30 73,50 62,70 38,70 27,50" fill="#B7D5ED" stroke="#3A82B8" stroke-width="3" stroke-linejoin="round" />
  
  <!-- "AI" Text -->
  <text x="50" y="59" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="26" fill="#285375" text-anchor="middle" letter-spacing="1">AI</text>
</svg>