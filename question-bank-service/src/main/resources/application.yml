server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: question-bank-service
  datasource:
    url: jdbc:mysql://localhost:3306/question_bank_db?createDatabaseIfNotExist=true
    username: root
    password: Kishore@052816
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
    properties:
      hibernate:
        format_sql: true

eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "




