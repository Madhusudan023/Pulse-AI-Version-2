server:
  forward-headers-strategy: framework
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/api/v1/employees/**, /api/v1/global-hr/**, /api/v1/regional-hr/**
        - id: survey-service
          uri: lb://survey-service
          predicates:
            - Path=/api/v1/surveys/**, /api/v1/employee/surveys/**
        - id: question-bank-service
          uri: lb://question-bank-service
          predicates:
            - Path=/api/v1/questions/**
        - id: reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/api/v1/reports/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: employee-service
        url: /employee-service/v3/api-docs
      - name: survey-service
        url: /survey-service/v3/api-docs
      - name: question-bank-service
        url: /question-bank-service/v3/api-docs
      - name: sentiment-service
        url: /sentiment-service/v3/api-docs
      - name: reporting-service
        url: /reporting-service/v3/api-docs
      - name: notification-service
        url: /notification-service/v3/api-docs




